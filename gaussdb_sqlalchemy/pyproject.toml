[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussdb-sqlalchemy"
version = "0.1.0"
description = "SQLAlchemy dialect for Huawei GaussDB, supporting psycopg2 and gaussdb (psycopg3 fork)."
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{ name = "GaussDB Python Driver Contributors" }]
keywords = ["gaussdb", "sqlalchemy", "database", "driver", "dialect"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "SQLAlchemy>=2.0,<2.2",
]

[project.optional-dependencies]
psycopg3 = [
    "gaussdb>=1.0.4",
]
psycopg2 = [
]
alembic = [
    "alembic>=1.13",
]
test = [
    "alembic>=1.13",
    "pytest>=6.2.5",
]

[project.urls]
Homepage = "https://github.com/jarrenL/gaussdb-python"

[project.entry-points."sqlalchemy.dialects"]
gaussdb = "gaussdb_sqlalchemy.base:GaussDBDialect"
"gaussdb.psycopg" = "gaussdb_sqlalchemy.base:GaussDBDialect"
"gaussdb.gaussdb" = "gaussdb_sqlalchemy.base:GaussDBDialect"
"gaussdb.psycopg2" = "gaussdb_sqlalchemy.base:GaussDBDialect_psycopg2"

[tool.setuptools]
packages = ["gaussdb_sqlalchemy"]

[tool.setuptools.package-dir]
gaussdb_sqlalchemy = "."
